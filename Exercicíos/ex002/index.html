<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linha</h1>
    <hr>
    <p>Você pode escrever um parágrafo de qualquer jeito. Basta colocar no meio de tags &lt;p&gt; e &lt;/p&gt; </p><!-- lt = Less Then / gt = Greather then-->
    <p>Se precisar quebrar o texo em um lugar específico como esse <br> basta usar a tag &lt;br&gt;</p>
    <!--A tag <br> - Breaking Row serve para fazer uma quebra de linha-->
    <p>Vamos colocar alguns símbolos especiais: 
        &reg;
        &copy;
        &trade;
        &euro;
        &pound;
        &yen;
        &cent;
        &uarr;
    </p>
    <p>
        Vamos adicionar alguns emoji:
        &#x1F605;
    </p>
</body>
</html>
