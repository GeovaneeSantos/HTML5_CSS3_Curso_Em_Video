<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias HTML5</title>
</head>
<body>
    <h1>Imagens Dinâmicas</h1>
    <p>Tente abrir este site em vários dispositivos diferentes ou aumente e diminua o tamanho da janela do navegador.</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexível">
    </picture>

    <h1>Reproduzindo Áudio em HTML5</h1>
    <p>Vamos aprender a reproduzir um áudio em HTML5.</p>
    <!-- <audio src="midia/musica.mp3" autoplay controls></audio> -->
    <audio preload="" controls autoplay loop>
        <source src="midia/musica.mp3" type="audio/mpeg">
        <p>Seu navegador não suporta audio mp3 ! <a href="midia/musica.mp3">Clique aqui para baixar seu Áudio MP3</a>
        </p>
        
    </audio>
</body>
</html>
