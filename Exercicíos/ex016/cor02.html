<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente CSS</title>
    <style>
        /*  O seletor '*' seleciona todos os elementos do documento */
        *{
            height: 100%; /* Define a altura de todos os elementos como 100% */
        }
        body{
            /*background-color: rgb(88, 88, 255); Cor de fundo simples e sólida*/
            background-image: linear-gradient(to right, #FF144E, #004df2);
            background-attachment: fixed; /* Mantém o fundo fixo ao rolar a página */
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
</body>
</html>
