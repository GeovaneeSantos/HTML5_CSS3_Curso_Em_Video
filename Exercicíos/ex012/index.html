<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML5</title>
</head>
<body>
    <h1>Inserindo videos hospedados localmente</h1>
    <p>Este video esta hospedado no meu servidor.</p>
    <video controls width="560px" autoplay>
        <source src="midia/meu-video.webm" type="video/webm">
        <source src="midia/meu-video.mp4" type="video/mp4">
        <p>Seu navegador não suporta o formato de vídeo.</p>
    </video>

    <h1>Inserindo videos hospedados no youtube</h1>
    <iframe width="100%" height="315px" src="https://www.youtube.com/embed/FET1XkLeeUs?si=N3AlUqEMs9l7_d1N"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay=; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
