<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhando com Links</title>
</head>
<body>
    <!--A tag <a> - Âncora serve para ancorar um conteudo a outra pagina web, ela vem com a propriedade href - Hypertext reference para inserir a URL na qual a tag irá se ancorar-->
    <h1>Usando links externos</h1>
    <!--Ao usar tags externas é recomendado usar a propridade target e rel-->
    <p>Voce pode acessar meu <a href="https://www.youtube.com/@CortesFoMindset" target="_blank" rel="external">canal no yt</a></p>
    <!--A propriedade target diz como abrir o link, o valor _blank força o navegador a abrir o link em uma nova guia em branco, o external diz que o arquivo é relacionado a uma pagina externa, é recomendado usar essa dinâmica quando o link leva à navegação que não faça parte da sua-->
    <h1>Usando links Externos</h1> 
    <p>Essa é a primeira página do site, se quiser acessar a minha <a href="pag002.html" rel="next">segunda página</a></p>
    <p>Você também pode acessar a <a href="noticias/pag003.html">Página de noticias</a></p>

    <h1>Links para download</h1>
    <ul>
        <li>
            <a href="Certificado/Cerfificado Java Básico.pdf">Baixar o certificado em PDF</a>
        </li>
        <li>
            <a href="Certificado/Java.rar" download="Java.rar" type="application/zip">Baixar o
                certificado em .rar</a>
        </li>
    </ul>
</body>
</html>
